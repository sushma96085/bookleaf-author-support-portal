<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>BookLeaf | Author Support</title><style>
:root{font-family:Inter,system-ui,Arial;color:#1d2939;background:#f4f6f8}*{box-sizing:border-box}body{margin:0}header{background:#173a32;color:white;padding:20px 5%;display:flex;align-items:center;justify-content:space-between}main{max-width:1120px;margin:32px auto;padding:0 20px}.panel{background:white;border:1px solid #e5e7eb;border-radius:14px;padding:22px;margin-bottom:18px;box-shadow:0 2px 8px #00000008}h1,h2,h3{margin-top:0}input,select,textarea,button{font:inherit;padding:10px 12px;border-radius:8px;border:1px solid #cbd5e1}input,textarea,select{width:100%;margin:5px 0 12px}button{cursor:pointer;background:#176f54;color:white;border:0}button.secondary{background:#e8f2ef;color:#174f3d}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(260px,1fr));gap:16px}.muted{color:#667085}.ticket{border-top:1px solid #e5e7eb;padding:16px 0}.ticket:first-child{border-top:0}.pill{display:inline-block;background:#e8f2ef;padding:4px 9px;border-radius:20px;font-size:12px}label{font-weight:600;font-size:14px}.error{color:#b42318}.success{color:#087443}#workspace{display:none}#login{max-width:460px;margin:80px auto}nav button{margin-left:8px}@media(max-width:600px){header{padding:15px}main{margin:18px auto}}</style></head><body>
<header><strong>BookLeaf · Author Support Portal</strong><nav><span id="who"></span> <button id="logout" class="secondary" hidden>Sign out</button></nav></header>
<main><section id="login" class="panel"><h1>Welcome back</h1><p class="muted">Sign in with your assigned author or admin account.</p><form id="loginForm"><label>Email<input type="email" name="email" required autocomplete="username"></label><label>Password<input type="password" name="password" required autocomplete="current-password"></label><button>Sign in</button></form><p id="loginError" class="error" role="alert"></p></section>
<div id="workspace"><h1 id="heading"></h1><p class="muted" id="subheading"></p><section id="authorArea" hidden><div class="panel"><h2>My Books & Royalties</h2><div id="books" class="grid"></div></div><div class="panel"><h2>Submit Support Query</h2><form id="ticketForm"><label>Related book<select name="bookId" id="bookSelect"><option value="">General / Account</option></select></label><label>Subject<input name="subject" required minlength="3" maxlength="200"></label><label>Details<textarea name="description" required minlength="10" rows="4"></textarea></label><button>Create ticket</button></form><p id="ticketMessage" role="status"></p></div></section><section class="panel"><h2 id="ticketHeading">My Tickets</h2><div id="tickets"></div></section></div></main>
<script>
let token='',role='',refreshTimer=null;
const $=id=>document.getElementById(id);
function el(tag,text,cls){const n=document.createElement(tag);if(text!==undefined)n.textContent=String(text);if(cls)n.className=cls;return n}
function add(parent,tag,text,cls){const n=el(tag,text,cls);parent.append(n);return n}
async function api(path,options={}){const r=await fetch('/api'+path,{...options,headers:{'Content-Type':'application/json',...(token?{Authorization:'Bearer '+token}:{}),...(options.headers||{})}});const data=await r.json().catch(()=>({}));if(!r.ok)throw new Error(data.error||'Request failed ('+r.status+')');return data}
$('loginForm').onsubmit=async e=>{e.preventDefault();$('loginError').textContent='';const form=new FormData(e.target);try{const data=await api('/auth/login',{method:'POST',body:JSON.stringify(Object.fromEntries(form))});token=data.token;role=data.role;$('who').textContent=data.name;$('heading').textContent=role==='admin'?'Admin Ticket Queue':'Author Dashboard';$('subheading').textContent=role==='admin'?'Manage requests, priority and responses':'Manage books, royalties and support requests';$('login').hidden=true;$('login').style.display='none';$('workspace').style.display='block';$('logout').hidden=false;$('authorArea').hidden=role!=='author';$('ticketHeading').textContent=role==='admin'?'All Support Tickets':'My Tickets';if(role==='author')await loadBooks();await loadTickets();refreshTimer=setInterval(()=>loadTickets().catch(console.error),10000)}catch(err){$('loginError').textContent=err.message}};
$('logout').onclick=()=>{clearInterval(refreshTimer);token='';role='';$('workspace').style.display='none';$('login').style.display='block';$('logout').hidden=true;$('who').textContent=''};
async function loadBooks(){const books=await api('/books');$('books').replaceChildren();$('bookSelect').replaceChildren(new Option('General / Account',''));for(const b of books){const card=el('article',undefined,'panel');add(card,'h3',b.title);add(card,'p','ISBN: '+(b.isbn||'Pending'));add(card,'p','Status: '+(b.status||'Unknown'));add(card,'p','Copies sold: '+(b.copiesSold??0));add(card,'p','Royalty earned: ₹'+(b.royaltyEarned??0));add(card,'p','Pending: ₹'+(b.royaltyPending??0));$('books').append(card);$('bookSelect').add(new Option(b.title,b._id))}}
$('ticketForm').onsubmit=async e=>{e.preventDefault();const data=Object.fromEntries(new FormData(e.target));if(!data.bookId)delete data.bookId;try{await api('/tickets',{method:'POST',body:JSON.stringify(data)});e.target.reset();$('ticketMessage').textContent='Ticket created successfully';$('ticketMessage').className='success';await loadTickets()}catch(err){$('ticketMessage').textContent=err.message;$('ticketMessage').className='error'}};
async function loadTickets(){const tickets=await api('/tickets');const root=$('tickets');root.replaceChildren();if(!tickets.length){add(root,'p','No tickets yet.','muted');return}for(const t of tickets){const item=el('article',undefined,'ticket');add(item,'h3',t.subject);add(item,'span',t.status+' · '+t.priority+' · '+t.category,'pill');add(item,'p',t.description);for(const m of t.messages||[])add(item,'p',(m.by==='admin'?'BookLeaf Support: ':'Author: ')+m.body);if(role==='admin'){const status=el('select');for(const v of ['Open','In Progress','Resolved','Closed'])status.add(new Option(v,v));status.value=t.status;const priority=el('select');for(const v of ['Critical','High','Medium','Low'])priority.add(new Option(v,v));priority.value=t.priority;const update=el('button','Save status / priority');update.onclick=async()=>{try{await api('/admin/tickets/'+t._id,{method:'PATCH',body:JSON.stringify({status:status.value,priority:priority.value})});await loadTickets()}catch(e){alert(e.message)}};item.append(status,priority,update);const draft=add(item,'p','Suggested draft: '+(t.aiDraft||'Not available'),'muted');const reply=el('textarea');reply.placeholder='Edit and send a reply';reply.value=t.aiDraft||'';const send=el('button','Send response');send.onclick=async()=>{try{await api('/admin/tickets/'+t._id+'/reply',{method:'POST',body:JSON.stringify({body:reply.value})});await loadTickets()}catch(e){alert(e.message)}};item.append(reply,send);const note=el('textarea');note.placeholder='Internal note (hidden from author)';const saveNote=el('button','Save internal note','secondary');saveNote.onclick=async()=>{try{await api('/admin/tickets/'+t._id+'/notes',{method:'POST',body:JSON.stringify({body:note.value})});await loadTickets()}catch(e){alert(e.message)}};item.append(note,saveNote)}root.append(item)}}
</script></body></html>
